<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soul Launcher - Forgot Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../soul-core.css">
    <link rel="stylesheet" href="../error-handling/Notification.css">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="auth.css">
    <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
</head>
<body class="theme-blue">
     <!-- CUSTOM TITLEBAR -->
     <div id="titlebar">
         <div class="tb-left">
             <img src="../../assets/icons/icon.png" class="tb-icon" alt="Soul Icon">
             <span class="tb-title">Soul Launcher - Forgot Password</span>
         </div>
        <div class="tb-controls">
            <button class="tb-btn" id="btn-min"><i class="fa-solid fa-square-minus"></i></button>
            <button class="tb-btn" id="btn-max"><i class="fa-solid fa-window-maximize"></i></button>
            <button class="tb-btn tb-cls" id="btn-close"><i class="fa-solid fa-circle-xmark"></i></button>
        </div>
    </div>

    <div class="auth-bg"></div>
    <div class="auth-bg-overlay"></div>

    <div id="app">
        <div class="ghost-layer"></div>
        <div id="login-overlay" class="hidden">
            <div class="loader-circle"></div>
            <p id="overlay-msg">Sending reset email...</p>
        </div>
        <div class="auth-container">
            <div class="auth-box">
                <div class="auth-brand"><span class="hl">SOUL</span>LAUNCHER</div>
                <h1>Forgot Password</h1>
                <p>Enter your email to reset your password</p>
                <div class="soul-mention">You are resetting your <b>Soul</b> account password</div>

                <div id="auth-error" class="auth-error"></div>
                <div id="auth-success" style="margin-top:12px;padding:10px 14px;background:rgba(34,197,94,0.15);
                  border:2px solid rgba(34,197,94,0.35);color:#86efac;font-family:'JetBrains Mono',monospace;
                  font-size:12px;letter-spacing:.03em;display:none;border-radius:var(--radius);"></div>

                <form id="forgot-pw-form" class="auth-input-group">
                    <input type="email" id="reset-email" placeholder="Email address" required autocomplete="email">
                    <button type="submit" id="btn-reset-submit" class="auth-btn">
                        <i class="fa-solid fa-paper-plane"></i>
                        <span>Send Reset Email</span>
                    </button>
                </form>

                <div class="auth-divider"><span>OR</span></div>

                <button id="btn-back-to-login" class="auth-btn secondary">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Back to Login</span>
                </button>
            </div>
            <div class="footer-text">
                <i class="fa-solid fa-copyright"></i> 2026 Soul Launcher. All rights reserved.
            </div>
        </div>
    </div>

    <script src="../error-handling/Notification.js"></script>
    <script>
    // --- Global error safety: never let an unhandled error close the launcher ---
    window.onerror = function (msg, url, line) {
        console.error('[FORGOT-PW] Unhandled error:', msg, 'at', url, ':', line);
        try { window.notifications.show('error', 'Error', String(msg)); } catch (_) {}
        return true;
    };
    window.onunhandledrejection = function (ev) {
        console.error('[FORGOT-PW] Unhandled rejection:', ev.reason);
        try { window.notifications.show('error', 'Error', String(ev.reason && ev.reason.message ? ev.reason.message : ev.reason)); } catch (_) {}
    };

    (async () => {
        // Window Controls
        document.getElementById('btn-min').onclick = () => window.soul.minimize();
        document.getElementById('btn-max').onclick = () => window.soul.maximize();
        document.getElementById('btn-close').onclick = () => window.soul.close();

        // Theme
        const savedTheme = await window.soul.getSetting('theme');
        if (savedTheme) {
            document.body.classList.remove(...Array.from(document.body.classList).filter(c=>c.startsWith('theme-')));
            document.body.classList.add(`theme-${savedTheme}`);
        }
        document.body.classList.remove('app-paper','app-modern');

        // --- Firebase init ---
        let auth;
        try {
            ({ auth } = initFirebase());
        } catch (e) {
            console.error('[FIREBASE] Init failed:', e);
            window.notifications.show('error', 'Firebase Error', 'Authentication service unavailable.');
            return;
        }

        // --- UI elements ---
        const form = document.getElementById('forgot-pw-form');
        const emailInput = document.getElementById('reset-email');
        const submitBtn = document.getElementById('btn-reset-submit');
        const errorEl = document.getElementById('auth-error');
        const successEl = document.getElementById('auth-success');
        const backBtn = document.getElementById('btn-back-to-login');
        const loginOverlay = document.getElementById('login-overlay');
        const overlayMsg = document.getElementById('overlay-msg');

        const showError = (msg) => { errorEl.textContent = msg; errorEl.classList.add('show'); successEl.classList.remove('show'); };
        const showSuccess = (msg) => { successEl.textContent = msg; successEl.classList.add('show'); errorEl.classList.remove('show'); };

        const showLoader = (msg) => { overlayMsg.textContent = msg; loginOverlay.classList.remove('hidden'); };
        const hideLoader = () => loginOverlay.classList.add('hidden');

        // Navigation
        backBtn.onclick = () => { try { window.location.href = 'login.html'; } catch (_) {} };

        // --- Password Reset ---
        form.onsubmit = async (e) => {
            e.preventDefault();
            errorEl.classList.remove('show');
            successEl.classList.remove('show');

            const email = emailInput.value.trim();
            if (!email) {
                showError('Please enter your email address.');
                return;
            }

            showLoader('Sending reset email...');
            submitBtn.disabled = true;

            try {
                await auth.sendPasswordResetEmail(email);
                showSuccess('Password reset email sent! Please check your inbox.');
                window.notifications.show('success', 'Email Sent', 'Check your email to reset your password.');
                setTimeout(() => { try { window.location.href = 'login.html'; } catch (_) {} }, 1500);
            } catch (err) {
                console.error('[RESET] Error:', err);
                let msg = 'Failed to send reset email.';
                if (err.code === 'auth/user-not-found') {
                    msg = 'No account found with this email address.';
                } else if (err.code === 'auth/invalid-email') {
                    msg = 'Invalid email address.';
                } else if (err.code === 'auth/too-many-requests') {
                    msg = 'Too many requests. Please wait a moment before trying again.';
                } else if (err.message) {
                    msg = 'Soul account error: ' + err.message;
                }
                showError(msg);
            } finally {
                hideLoader();
                submitBtn.disabled = false;
            }
        };

        // Discord RPC
        window.soul.setRPC('Soul Launcher', 'Forgot Password Screen');
    })();
    </script>
</body>
</html>
