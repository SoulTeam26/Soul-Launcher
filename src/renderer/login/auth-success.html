<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soul Launcher - Login Successful</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Segoe UI', Inter, Arial, sans-serif;
    background: #06080c url('bg') center / cover no-repeat;
    color: #eef2f7;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
  .shade { position: fixed; inset: 0; background: rgba(4, 6, 10, 0.55); pointer-events: none; }
  .card {
    position: relative;
    text-align: center;
    background: rgba(13, 17, 24, 0.9);
    border: 2px solid #2a3346;
    box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.5);
    padding: 48px 64px;
    max-width: 520px;
  }
  .brand {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: #8b96a8;
    margin-bottom: 24px;
  }
  .tick {
    width: 84px;
    height: 84px;
    margin: 0 auto 24px;
    border-radius: 50%;
    background: #22c55e;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 0 8px rgba(34, 197, 94, 0.18), 0 12px 32px rgba(34, 197, 94, 0.35);
    animation: pop 0.45s cubic-bezier(0.2, 1.4, 0.4, 1);
  }
  @keyframes pop {
    from { transform: scale(0.4); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  h1 {
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 0.06em;
    margin-bottom: 10px;
  }
  .player {
    font-size: 14px;
    font-weight: 700;
    color: #FF3B30;
    letter-spacing: 0.08em;
    margin-bottom: 18px;
  }
  p {
    font-size: 14px;
    color: #9aa5b8;
    line-height: 1.6;
  }
</style>
</head>
<body>
<div class="shade"></div>
<div class="card">
  <div class="brand">Soul Launcher</div>
  <div class="tick">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none">
      <path d="M4 12.5l5 5L20 6.5" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <h1>LOGIN SUCCESSFUL</h1>
  <div class="player">{{PLAYER}}</div>
  <p>You can now close this window<br>and return to the launcher.</p>
</div>
</body>
</html>
